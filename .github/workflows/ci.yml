name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check-types
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: PluginZip
          path: PluginZip.zip
